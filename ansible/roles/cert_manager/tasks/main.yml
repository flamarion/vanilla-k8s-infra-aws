---
- name: Create local super-admin kubeconfig
  ansible.builtin.shell: |
    sed 's|server: https://.*:6443|server: https://127.0.0.1:6443|' \
      /etc/kubernetes/super-admin.conf > /tmp/super-admin-local.conf
    chown ubuntu:ubuntu /tmp/super-admin-local.conf
    chmod 0600 /tmp/super-admin-local.conf
  changed_when: false

- name: Add jetstack Helm repository
  kubernetes.core.helm_repository:
    name: jetstack
    repo_url: https://charts.jetstack.io
  environment:
    KUBECONFIG: /tmp/super-admin-local.conf
  become: false

- name: Install cert-manager CRDs
  ansible.builtin.command: >
    kubectl apply -f {{ cert_manager_crds_url }}
  environment:
    KUBECONFIG: /tmp/super-admin-local.conf
  become: false
  changed_when: false

- name: Install cert-manager
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: jetstack/cert-manager
    chart_version: "{{ cert_manager_chart_version | default(omit, true) }}"
    release_namespace: cert-manager
    create_namespace: true
    values:
      installCRDs: false
      extraEnv:
        - name: AWS_REGION
          value: "{{ aws_region | default('eu-central-1') }}"
    wait: false
  environment:
    KUBECONFIG: /tmp/super-admin-local.conf
  become: false

- name: Wait for cert-manager webhook to be ready
  ansible.builtin.shell: |
    kubectl -n cert-manager rollout status deployment/cert-manager-webhook --timeout=180s
  environment:
    KUBECONFIG: /tmp/super-admin-local.conf
  become: false
  changed_when: false
  retries: 3
  delay: 10
  register: webhook_ready
  until: webhook_ready.rc == 0

- name: Create Let's Encrypt ClusterIssuer (staging)
  ansible.builtin.shell: |
    cat <<'EOF' | kubectl apply -f -
    apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: letsencrypt-staging
    spec:
      acme:
        server: https://acme-staging-v02.api.letsencrypt.org/directory
        email: admin@{{ domain_name }}
        privateKeySecretRef:
          name: letsencrypt-staging-key
        solvers:
          - dns01:
              route53:
                region: {{ aws_region | default('eu-central-1') }}
    EOF
  environment:
    KUBECONFIG: /tmp/super-admin-local.conf
  become: false
  changed_when: false

- name: Create Let's Encrypt ClusterIssuer (production)
  ansible.builtin.shell: |
    cat <<'EOF' | kubectl apply -f -
    apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: letsencrypt-prod
    spec:
      acme:
        server: https://acme-v02.api.letsencrypt.org/directory
        email: admin@{{ domain_name }}
        privateKeySecretRef:
          name: letsencrypt-prod-key
        solvers:
          - dns01:
              route53:
                region: {{ aws_region | default('eu-central-1') }}
    EOF
  environment:
    KUBECONFIG: /tmp/super-admin-local.conf
  become: false
  changed_when: false

- name: Clean up temp kubeconfig
  ansible.builtin.file:
    path: /tmp/super-admin-local.conf
    state: absent
