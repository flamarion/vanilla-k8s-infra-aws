[defaults]
inventory = inventory/terraform_inventory.py
roles_path = roles
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
result_format = yaml
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .ansible_fact_cache
fact_caching_timeout = 3600
interpreter_python = auto_silent
# SSH private key resolution (in priority order):
#   1. SSH_KEY_PATH environment variable (used by inventory script ProxyCommand)
#   2. ANSIBLE_PRIVATE_KEY_FILE environment variable (Ansible standard)
#   3. ansible_ssh_private_key_file inventory var (defaults to ./deployment)
# Set `private_key_file` here only if you want to override the defaults.
# private_key_file = ~/.ssh/your_key

[privilege_escalation]
become = True
become_method = sudo
become_user = root

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o StrictHostKeyChecking=no
